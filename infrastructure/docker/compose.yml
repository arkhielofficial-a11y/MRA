services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mra
      POSTGRES_USER: mra
      POSTGRES_PASSWORD: mra_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mra-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mra -d mra"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["cache"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

volumes:
  mra-postgres-data:
